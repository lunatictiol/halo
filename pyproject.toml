[project]
name = "halo"
version = "0.1.0"
description = "Grounded question answering over research papers with corrective retrieval and abstention"
requires-python = ">=3.12,<3.13"
dependencies = ["pymupdf>=1.24", "qdrant-client>=1.12"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
