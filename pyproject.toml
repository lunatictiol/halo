[project]
name = "halo"
version = "0.1.0"
description = "Grounded question answering over research papers with corrective retrieval and abstention"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.14",
    "fastapi>=0.155.0",
    "langgraph>=1.2.16",
    "pymupdf>=1.24",
    "pystemmer>=3.1.0",
    "qdrant-client>=1.12",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CUDA torch wheels for the cross-encoder reranker (PyPI's Windows torch is CPU-only).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
