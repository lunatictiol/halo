[project]
name = "halo"
version = "0.1.0"
description = "Grounded question answering over research papers with corrective retrieval and abstention"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.14",
    "fastapi>=0.155.0",
    "langgraph>=1.2.16",
    "pymupdf>=1.24",
    "pystemmer>=3.1.0",
    "qdrant-client>=1.12",
    "scikit-learn>=1.5",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["halo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Explicit, so a ruff upgrade cannot change what CI enforces: pyflakes, pycodestyle errors, import order.
select = ["E4", "E7", "E9", "F", "I"]

# CUDA torch wheels for the cross-encoder reranker on Windows (PyPI's Windows torch is CPU-only). Linux is only the
# CI runner, which has no GPU: CPU wheels skip ~3 GB of CUDA libraries (D40).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
