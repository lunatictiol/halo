# HALO configuration. All tunable values live here; see DECISIONS.md for why each was chosen.

[data]
hf_base_url = "https://huggingface.co/datasets/vectara/open_ragbench/resolve/main/pdf/arxiv"
data_dir = "data"
# arXiv asks automated clients to use the export mirror instead of arxiv.org.
arxiv_pdf_host = "https://export.arxiv.org"
# arXiv's terms for automated access: at most one request every 3 seconds, single connection.
arxiv_delay_seconds = 3.0
http_timeout_seconds = 60
# arXiv throttles bursts with transient 406s and dropped connections; exponential backoff rides them out.
http_retries = 5

[splits]
seed = 20261003
held_out_papers = 20
dev_sample_min_questions = 300
dev_distractors = 60

[models]
llm = "qwen3:8b"
embedding = "nomic-embed-text"
# 127.0.0.1, not localhost: on Windows "localhost" tries IPv6 ::1 first and adds ~2 s to every call (D25).
ollama_url = "http://127.0.0.1:11434"

[ingest]
# Chunk = consecutive PDF blocks of one Vectara section, split into word windows (DECISIONS.md D12-D13).
chunk_words = 300
overlap_words = 50
# Block -> section mapping: word n-gram size and the minimum share of a block's n-grams found in its best section.
shingle_n = 5
min_match = 0.3

[index]
qdrant_path = "data/index/qdrant"
embed_batch = 64
# nomic-embed-text is trained with these task prefixes; omitting them degrades retrieval.
doc_prefix = "search_document: "
query_prefix = "search_query: "

[llm]
# Deterministic decoding so reruns of generation and judging are reproducible.
temperature = 0
seed = 0
# Explicit window: Ollama's default is smaller and truncates long prompts silently. 5 chunks x 300 words
# is ~2.5k tokens; halo/llm.py raises if a call reaches this limit.
num_ctx = 8192
# qwen3 "thinking" multiplies output tokens ~5-10x at 17.7 tok/s; off for every M2 call (DECISIONS.md D19).
think = false
# Ollama GPU layers for qwen3:8b (36 layers). Ollama's automatic choice (~23) ignores the reranker's VRAM, so both
# spill into shared memory once the M4 loop alternates them; 22 measured fastest (D29, results/m4_rerank_device_bench.json).
num_gpu = 22
timeout_seconds = 600
# Ollama can 500 while swapping models in/out of VRAM; retry with linear backoff.
http_retries = 3
retry_backoff_seconds = 5

[retrieve]
collection = "dev_slice"
# Retrieval metrics are computed on k_eval chunks; the generator sees the top k_context (DECISIONS.md D19).
k_eval = 10
k_context = 5
recall_ks = [5, 10]
# dense | bm25 | hybrid (RRF of dense + BM25) | hybrid_rerank (cross-encoder over the fused list). DECISIONS.md D24.
method = "hybrid_rerank"
# Each retriever returns this many; RRF output is cut to it before reranking (D22). Recall@k_candidates is
# reported as the ceiling a reranker can reach.
k_candidates = 50
# RRF constant from Cormack et al. (2009); damps the weight of top ranks so one retriever cannot dominate (D22).
rrf_k = 60

[bm25]
# bm25s defaults (Robertson/Lucene k1 and b); stemming + English stopwords (D21).
k1 = 1.5
b = 0.75
stemmer = "english"
stopwords = "en"

[rerank]
model = "BAAI/bge-reranker-v2-m3"
# 300-word chunks are ~400 tokens; 512 fits query + chunk without truncating chunk text in most cases (D23).
max_length = 512
batch_size = 16
# auto (GPU if present) | cuda | cpu. GPU: 1.4 s vs 39.7 s per query on CPU, identical top-5 (D29).
device = "cuda"

[generate]
prompt_version = "baseline-v1"
max_tokens = 400
sentinel = "INSUFFICIENT_EVIDENCE"
system_prompt = """You answer questions about research papers using ONLY the numbered context passages you are given. \
Do not use outside knowledge. Answer directly and concisely, in at most a few sentences. \
If the passages do not contain the information needed to answer the question, reply with exactly {sentinel} and nothing else."""
user_prompt = """Context passages:

{context}

Question: {question}

Answer:"""

[judge]
# Judge model is recorded in every results file. Same model as the generator: see DECISIONS.md D18 on self-preference.
model = "qwen3:8b"
prompt_version = "judge-v1"
max_tokens = 200
parse_retries = 1
system_prompt = """You are a strict, impartial grader for a question-answering system over research papers. \
Respond only with JSON containing "reason" (one sentence) and "verdict"."""
faithfulness_prompt = """Decide whether the ANSWER is supported by the CONTEXT.
- "supported": every factual claim in the answer is stated in, or directly inferable from, the context.
- "unsupported": at least one claim is absent from or contradicts the context.
Judge only support by the context, not whether the answer is correct or complete.

QUESTION: {question}

CONTEXT:
{context}

ANSWER: {answer}"""
correctness_prompt = """Decide whether the CANDIDATE answer is correct, using the REFERENCE answer as ground truth.
- "correct": the candidate conveys the key facts of the reference and does not contradict it. Different wording, \
extra detail, or omitting secondary details is fine.
- "incorrect": the candidate misses the main point, contradicts the reference, or answers a different question.

QUESTION: {question}

REFERENCE: {reference}

CANDIDATE: {answer}"""

[graph]
# M4 corrective loop: retrieve -> rerank -> grade -> (rewrite -> retrieve)* -> generate | abstain (D26-D28).
# Retries after the first attempt; 2 means at most 3 retrieval attempts per question.
max_retries = 2
# First-stage retrieval inside the loop; the rerank node always follows it.
retrieve_method = "hybrid"
grade_prompt_version = "grade-v1"
grade_max_tokens = 150
grade_parse_retries = 1
grade_system_prompt = """You check whether passages retrieved from research papers contain the information needed to answer \
a question. Respond only with JSON containing "reason" (one sentence) and "verdict"."""
grade_prompt = """Decide whether the PASSAGES contain the specific information needed to answer the QUESTION.
- "sufficient": at least one passage states the facts the answer needs, or they follow directly from it.
- "insufficient": the passages are only on a related topic, describe a different method, model, dataset or paper \
than the one the question is about, or leave out the key fact.
Do not answer the question and do not use outside knowledge. If insufficient, the reason must name what is missing.

QUESTION: {question}

PASSAGES:
{context}"""
rewrite_prompt_version = "rewrite-v1"
rewrite_max_tokens = 60
rewrite_system_prompt = """You write search queries for a keyword + semantic search engine over research papers. \
Output only the new query, on one line, with no explanation."""
rewrite_prompt = """A search did not find passages that answer the question.

QUESTION: {question}

QUERIES ALREADY TRIED:
{tried}

WHY THE RESULTS FELL SHORT: {reason}

Write one new search query that is more likely to retrieve the passage answering the question. Use the specific \
technical terms, method names and quantities the answer would contain. Do not repeat a query already tried."""
