# HALO configuration. All tunable values live here; see DECISIONS.md for why each was chosen.

[data]
hf_base_url = "https://huggingface.co/datasets/vectara/open_ragbench/resolve/main/pdf/arxiv"
data_dir = "data"
# arXiv asks automated clients to use the export mirror instead of arxiv.org.
arxiv_pdf_host = "https://export.arxiv.org"
# arXiv's terms for automated access: at most one request every 3 seconds, single connection.
arxiv_delay_seconds = 3.0
http_timeout_seconds = 60
# arXiv throttles bursts with transient 406s and dropped connections; exponential backoff rides them out.
http_retries = 5

[splits]
seed = 20261003
held_out_papers = 20
dev_sample_min_questions = 300
dev_distractors = 60

[models]
llm = "qwen3:8b"
embedding = "nomic-embed-text"
# 127.0.0.1, not localhost: on Windows "localhost" tries IPv6 ::1 first and adds ~2 s to every call (D25).
ollama_url = "http://127.0.0.1:11434"

[ingest]
# Chunk = consecutive PDF blocks of one Vectara section, split into word windows (DECISIONS.md D12-D13).
chunk_words = 300
overlap_words = 50
# Block -> section mapping: word n-gram size and the minimum share of a block's n-grams found in its best section.
shingle_n = 5
min_match = 0.3

[index]
qdrant_path = "data/index/qdrant"
embed_batch = 64
# nomic-embed-text is trained with these task prefixes; omitting them degrades retrieval.
doc_prefix = "search_document: "
query_prefix = "search_query: "

[llm]
# Deterministic decoding so reruns of generation and judging are reproducible.
temperature = 0
seed = 0
# Explicit window: Ollama's default is smaller and truncates long prompts silently. 5 chunks x 300 words
# is ~2.5k tokens; halo/llm.py raises if a call reaches this limit.
num_ctx = 8192
# qwen3 "thinking" multiplies output tokens ~5-10x at 17.7 tok/s; off for every M2 call (DECISIONS.md D19).
think = false
# Ollama GPU layers for qwen3:8b (36 layers). Ollama's automatic choice (~23) ignores the reranker's VRAM, so both
# spill into shared memory once the M4 loop alternates them; 22 measured fastest (D29, results/m4_rerank_device_bench.json).
num_gpu = 22
timeout_seconds = 600
# Ollama can 500 while swapping models in/out of VRAM; retry with linear backoff.
http_retries = 3
retry_backoff_seconds = 5

[retrieve]
# M6: the shipped index is all 980 indexable papers. M1-M5 results used "dev_slice"; reproduce them with
# `eval.runners.run --collection dev_slice` (D36).
collection = "full"
# Retrieval metrics are computed on k_eval chunks; the generator sees the top k_context (DECISIONS.md D19).
k_eval = 10
k_context = 5
recall_ks = [5, 10]
# dense | bm25 | hybrid (RRF of dense + BM25) | hybrid_rerank (cross-encoder over the fused list). DECISIONS.md D24.
method = "hybrid"
# Each retriever returns this many; RRF output is cut to it before reranking (D22). Recall@k_candidates is
# reported as the ceiling a reranker can reach.
k_candidates = 50
# RRF constant from Cormack et al. (2009); damps the weight of top ranks so one retriever cannot dominate (D22).
rrf_k = 60

[bm25]
# bm25s defaults (Robertson/Lucene k1 and b); stemming + English stopwords (D21).
k1 = 1.5
b = 0.75
stemmer = "english"
stopwords = "en"

[rerank]
model = "BAAI/bge-reranker-v2-m3"
# 300-word chunks are ~400 tokens; 512 fits query + chunk without truncating chunk text in most cases (D23).
max_length = 512
batch_size = 16
# auto (GPU if present) | cuda | cpu. GPU: 1.4 s vs 39.7 s per query on CPU, identical top-5 (D29).
device = "cuda"

[generate]
prompt_version = "baseline-v1"
max_tokens = 400
sentinel = "INSUFFICIENT_EVIDENCE"
system_prompt = """You answer questions about research papers using ONLY the numbered context passages you are given. \
Do not use outside knowledge. Answer directly and concisely, in at most a few sentences. \
If the passages do not contain the information needed to answer the question, reply with exactly {sentinel} and nothing else."""
user_prompt = """Context passages:

{context}

Question: {question}

Answer:"""

[judge]
# Judge model is recorded in every results file. Same model as the generator: see DECISIONS.md D18 on self-preference.
provider = "ollama"
model = "qwen3:8b"
prompt_version = "judge-v1"
max_tokens = 200
parse_retries = 1
system_prompt = """You are a strict, impartial grader for a question-answering system over research papers. \
Respond only with JSON containing "reason" (one sentence) and "verdict"."""
faithfulness_prompt = """Decide whether the ANSWER is supported by the CONTEXT.
- "supported": every factual claim in the answer is stated in, or directly inferable from, the context.
- "unsupported": at least one claim is absent from or contradicts the context.
Judge only support by the context, not whether the answer is correct or complete.

QUESTION: {question}

CONTEXT:
{context}

ANSWER: {answer}"""
correctness_prompt = """Decide whether the CANDIDATE answer is correct, using the REFERENCE answer as ground truth.
- "correct": the candidate conveys the key facts of the reference and does not contradict it. Different wording, \
extra detail, or omitting secondary details is fine.
- "incorrect": the candidate misses the main point, contradicts the reference, or answers a different question.

QUESTION: {question}

REFERENCE: {reference}

CANDIDATE: {answer}"""

# Alternative judges, swapped into [judge] by name (eval.judge.with_judge). Same prompts, different model (M7).
[judges.qwen]
provider = "ollama"
model = "qwen3:8b"

[judges.gemini]
provider = "gemini"
model = "gemini-2.5-flash"  # free tier: 20 requests/day, too few for M7 (D39)

[judges.gemma]
provider = "gemini"
model = "gemma-4-31b-it"  # hosted endpoint too unreliable for M7: persistent 500/503 (D39)

[judges.llama]
provider = "ollama"
model = "llama3.1:8b"

[gemini]
url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"
# 0 disables 2.5 Flash's default dynamic thinking: greedy, no hidden reasoning, like the local judge (think = false).
thinking_budget = 0
# Space hosted calls so the free tier's per-minute limit is never hit (2.5 Flash: 10/min).
min_interval_seconds = 6.5
# The hosted Gemma endpoint returns transient 500/503 for minutes at a time; Ollama's 3 retries are too few.
http_retries = 8

[calibration]
# M7: blind human labels vs each judge on a seeded sample of the M6 headline runs (D39).
# Correctness needs a valid reference, so it samples dev_sample only. Faithfulness also samples the answered
# abstention_set questions: dev_sample has only 3 "unsupported" verdicts out of 290 judged.
correctness_runs = ["m6_graph_dev_sample"]
faithfulness_runs = ["m6_graph_dev_sample", "m6_graph_abstention_set"]
seed = 20261023
per_kind = 25
# Negatives (by the local judge's verdict) are oversampled up to this share; without it, kappa would rest on two
# or three disagreements.
negative_share = 0.4
judges = ["qwen", "llama"]

[graph]
# M4 corrective loop: retrieve -> rerank -> grade -> (rewrite -> retrieve)* -> generate | abstain (D26-D28).
# Retries after the first attempt; 2 means at most 3 retrieval attempts per question.
max_retries = 2
# First-stage retrieval inside the loop; the rerank node always follows it.
retrieve_method = "hybrid"
grade_prompt_version = "grade-v2"  # v1 refused 26/303 answerable, mostly "not explicitly stated" (D27)
grade_max_tokens = 150
grade_parse_retries = 1
grade_system_prompt = """You check whether passages retrieved from research papers contain the information needed to answer \
a question. Respond only with JSON containing "reason" (one sentence) and "verdict"."""
grade_prompt = """Decide whether the PASSAGES give enough to answer the QUESTION.
- "sufficient": the passages cover the subject the question asks about (the same method, model, concept or result), and an answer can be stated, summarised or reasonably inferred from what they say. The passages do not need to state the answer in the question's own words.
- "insufficient": the passages are about a different method, model, dataset or paper than the one the question names, or the key entity or quantity the question asks about does not appear in them at all.
Do not answer the question and do not use outside knowledge. If insufficient, the reason must name what is missing.

QUESTION: {question}

PASSAGES:
{context}"""
rewrite_prompt_version = "rewrite-v1"
rewrite_max_tokens = 60
rewrite_system_prompt = """You write search queries for a keyword + semantic search engine over research papers. \
Output only the new query, on one line, with no explanation."""
rewrite_prompt = """A search did not find passages that answer the question.

QUESTION: {question}

QUERIES ALREADY TRIED:
{tried}

WHY THE RESULTS FELL SHORT: {reason}

Write one new search query that is more likely to retrieve the passage answering the question. Use the specific \
technical terms, method names and quantities the answer would contain. Do not repeat a query already tried."""

[cite]
# M5: the graph's generator cites passages by label; code maps [Pn] -> (paper, section, page) (D31). The
# single-pipeline [generate] prompt is unchanged so M2/M3 runs stay reproducible.
prompt_version = "cite-v2"  # v1 numbered passages [1]..[5], colliding with bibliography markers in chunk text (D34)
system_prompt = """You answer questions about research papers using ONLY the context passages you are given, labelled [P1], [P2], ... Do not use outside knowledge. Answer directly and concisely, in at most a few sentences. End every sentence with the label of the passage that supports it in square brackets, for example [P2], or [P1][P3] when it combines two passages. Cite only passages that state what the sentence says. Numbers in square brackets inside the passages, such as [21], are the papers' own references: never copy them. If the passages do not contain the information needed to answer the question, reply with exactly {sentinel} and nothing else."""
# Grounding check: one call per sentence against all its cited passages together; a failed or uncited
# sentence is (re-)attributed to another single passage that supports it, if any (D32, D34, D35).
# v1 checked each (sentence, passage) pair alone and never checked uncited sentences.
check_prompt_version = "check-v2"
check_max_tokens = 150
check_parse_retries = 1
check_system_prompt = """You verify citations in answers about research papers. \
Respond only with JSON containing "reason" (one sentence) and "verdict"."""
check_prompt = """Decide whether the PASSAGES, taken together, support the CLAIM, a sentence from an answer to the QUESTION.
- "supported": every part of what the claim states is said in the passages or follows directly from them. Paraphrase and summary are fine.
- "unsupported": some part of the claim is not said in the passages, or contradicts them.
Judge only these passages and this claim; do not use outside knowledge.

QUESTION: {question}

CLAIM: {claim}

PASSAGES:
{passages}"""

[api]
# Longest accepted question; the longest Open RAG Bench question is 197 characters.
max_question_chars = 1000

[ci]
# M8 regression gate (D40). `eval.runners.ci run` writes results/<results>.json locally; CI runs `ci check`
# against results/<baseline>.json. Only deterministic retrieval metrics: LLM metrics are slow and non-deterministic.
split = "dev_sample"
results = "ci_retrieval_dev_sample"
baseline = "m8_ci_baseline"
metrics = ["recall@5", "mrr"]
# Absolute. One query out of 303 moves R@5 by 0.0033, so 0.005 tolerates a single flipped query and nothing more.
max_drop = 0.005
# Paths the results depend on; a change here after the results commit means the file is stale.
watch = ["halo", "config", "splits", "eval/metrics", "eval/runners", "eval/results.py", "pyproject.toml", "uv.lock"]
