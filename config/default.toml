# HALO configuration. All tunable values live here; see DECISIONS.md for why each was chosen.

[data]
hf_base_url = "https://huggingface.co/datasets/vectara/open_ragbench/resolve/main/pdf/arxiv"
data_dir = "data"
# arXiv asks automated clients to use the export mirror instead of arxiv.org.
arxiv_pdf_host = "https://export.arxiv.org"
# arXiv's terms for automated access: at most one request every 3 seconds, single connection.
arxiv_delay_seconds = 3.0
http_timeout_seconds = 60
# arXiv throttles bursts with transient 406s and dropped connections; exponential backoff rides them out.
http_retries = 5

[splits]
seed = 20261003
held_out_papers = 20
dev_sample_min_questions = 300
dev_distractors = 60

[models]
llm = "qwen3:8b"
embedding = "nomic-embed-text"
ollama_url = "http://localhost:11434"

[ingest]
# Chunk = consecutive PDF blocks of one Vectara section, split into word windows (DECISIONS.md D12-D13).
chunk_words = 300
overlap_words = 50
# Block -> section mapping: word n-gram size and the minimum share of a block's n-grams found in its best section.
shingle_n = 5
min_match = 0.3

[index]
qdrant_path = "data/index/qdrant"
embed_batch = 64
# nomic-embed-text is trained with these task prefixes; omitting them degrades retrieval.
doc_prefix = "search_document: "
query_prefix = "search_query: "
